<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f6;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #374151;
        }

        .currency-row {
            display: flex;
            align-items: end;
            gap: 10px;
        }

        .currency-row .input-group {
            flex: 1;
        }

        .swap-button {
            width: 44px;
            height: 44px;
            padding: 0;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: white;
            color: #374151;
            font-size: 18px;
            cursor: pointer;
        }

        .swap-button:hover {
            background: #f3f4f6;
        }

        .convert-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .convert-button:hover {
            background: #111827;
        }

        .convert-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 22px;
            background: #f3f4f6;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .result-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .result-amount {
            color: #111827;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .rate {
            color: #4b5563;
            font-size: 14px;
        }

        .timestamp {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 12px;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>

        <p class="subtitle">
            Convert currencies using live exchange rates
        </p>

        <div class="input-group">
            <label for="amount">Amount</label>

            <input type="number" id="amount" placeholder="Enter amount" min="0" step="any">
        </div>

        <div class="currency-row">

            <div class="input-group">
                <label for="from">From</label>

                <select id="from">
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="INR" selected>INR - Indian Rupee</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="CHF">CHF - Swiss Franc</option>
                </select>
            </div>

            <button class="swap-button" onclick="swapCurrencies()" title="Swap currencies">
                ⇄
            </button>

            <div class="input-group">
                <label for="to">To</label>

                <select id="to">
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="CHF">CHF - Swiss Franc</option>
                </select>
            </div>

        </div>

        <button class="convert-button" id="convertButton" onclick="convertCurrency()">
            Convert
        </button>

        <div class="result" id="result">

            <div class="result-label">
                Converted Amount
            </div>

            <div class="result-amount" id="resultAmount"></div>

            <div class="rate" id="rate"></div>

            <div class="timestamp" id="timestamp"></div>

        </div>

        <div class="error" id="error"></div>

        <div class="footer">
            Powered by Flask &amp; Frankfurter API
        </div>

    </div>


    <script>

        function swapCurrencies() {

            const from = document.getElementById("from");
            const to = document.getElementById("to");

            const temporary = from.value;

            from.value = to.value;
            to.value = temporary;
        }


        async function convertCurrency() {

            const amount = document.getElementById("amount").value;
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;

            const result = document.getElementById("result");
            const resultAmount = document.getElementById("resultAmount");
            const rate = document.getElementById("rate");
            const timestamp = document.getElementById("timestamp");
            const error = document.getElementById("error");
            const button = document.getElementById("convertButton");

            result.style.display = "none";
            error.style.display = "none";

            if (!amount || amount <= 0) {

                error.textContent = "Please enter a valid positive amount.";
                error.style.display = "block";

                return;
            }

            button.disabled = true;
            button.textContent = "Converting...";

            try {

                const response = await fetch(
                    `/convert?amount=${amount}&from=${from}&to=${to}`
                );

                const data = await response.json();

                if (!response.ok) {

                    error.textContent =
                        data.error || "Conversion failed.";

                    error.style.display = "block";

                    return;
                }

                resultAmount.textContent =
                    `${data.amount} ${data.from} = ${data.converted_amount} ${data.to}`;

                rate.textContent =
                    `1 ${data.from} = ${data.rate} ${data.to}`;

                timestamp.textContent =
                    `Updated: ${new Date().toLocaleString()}`;

                result.style.display = "block";

            } catch (err) {

                error.textContent =
                    "Unable to connect to the server.";

                error.style.display = "block";

            } finally {

                button.disabled = false;
                button.textContent = "Convert";
            }
        }

    </script>

</body>

</html>
